name: Core checks
on:
  pull_request:
  push:
    branches: [main, feat/core, fix/oneboss-fullflow]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: oneboss_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify SQL Editor bootstrap matches migrations
        run: |
          npm run db:bootstrap:generate
          git diff --exit-code -- docs/setup-supabase.sql
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/oneboss_test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
